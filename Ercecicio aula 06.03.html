<script>

    var numeros = new Array(25, 30, 45, 28, 0, 12, 78 ,64);
    //somar sómente os números pares da array acima

    var somaDosPares = somaOsPares(numeros)
    alert("A soma dos pares é: "+ somaDosPares)

    function somaOsPares(arr){

        var soma = 0

        for(var i = 0; i < arr.length; i++){
            if(!isNaN(arr[i]) && arr[i] %2 === 0){
                soma += arr[i]
            }
        }
        return soma;
    }

</script>
