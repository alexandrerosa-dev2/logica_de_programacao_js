<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Aula 03.01</h2>
    <h3>Vídeo 18 e 19</h3>

    <script>
       var numero = parseInt(prompt("Digite um número para a tabuada"))

       var indice = 1

       while(indice <= 1000) {
        document.write(numero + " * " + indice + " = " + (numero * indice) + " <br>")

            if(indice % 10 === 0 && indice > 0){
                document.write("<hr>")
            }
            indice = indice + 1
       }
       document.write("Fim da tabuada!")

    </script>
</body>
</body>
</html>
