<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Aula 2.6</h2>
    <h3>Vídeo 17</h3>

    <script>
       var n = prompt("Digite um número")
       n = parseInt(n)

       switch(n){
        case 1:
            alert("Boa escolha")
            break
        case 2:
            alert("Muito bom")
            break
        case 3:
            alert("Quase lá")
            break
        case 4:
            alert("Tá quente")
            break
        case 5:
            alert("Tá frio")
            break
        case 6:
            alert("Foi só um teste")
            break 
        default:
            alert("Escolha um número entre 1 e 6!")
            
       }
    </script>
</body>
</html>
