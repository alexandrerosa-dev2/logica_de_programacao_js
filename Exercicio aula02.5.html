<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Aula 2.4</h2>
    <h3>Vídeo 9</h3>

    <script>
            var nJogador1 = prompt("Digite um número")
            nJogador1 = parseInt(nJogador1)

            var nJogador2 = prompt("Digite outro número")
            nJogador2 = parseInt(nJogador2)

            // Se os números escolhidos forem iguais.
            if(nJogador1 == nJogador2){
                alert("Empate!")
            }else{

                //Sorteia um número.
                var nSort = parseInt(Math.random() * 2)

                //Se o número sorteado for 0, quem escolheu o menor número vence.
                if(nSort === 0){
                    if(nJogador1 < nJogador2){
                        alert("Jogador 1 venceu!")
                    }else{
                    alert("Jogador 2 venceu!")
                    }
                    
                //Se o número sorteado for mair que 0, quem escolheu o maior número vence.
                }else{
                    if(nJogador1 > nJogador2){
                    alert("Jogador 1 venceu!")
                    }else{
                        alert("Jogador 2 venceu!")
                    }
                }
            }                      
                
    </script>
</body>
</html>
