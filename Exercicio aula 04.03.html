<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Aula 04</h2>
    <h3>Video 24</h3>

    <button onclick="calcular('+')">+</button>
    <button onclick="calcular('-')">-</button>
    <button onclick="calcular('/')">/</button>
    <button onclick="calcular('*')">*</button>

    <button onclick="limparTela()">Limpar Tela</button>

    <div id="output">Calculadora</div>

    <script>

        var n1 = prompt("Digite um número")
        n1 = parseFloat(n1)
        
        escreve()

        function escreve(){
            var output = document.querySelector("#output")
            output.innerHTML = n1
        }

        function calcular(simbolo){
            var n = prompt("Digite outro número")
            n = parseFloat(n)
            
            switch(simbolo){
                case'+': n1 += n
                break

                case'-': n1 -= n
                break

                case '/': n1 /= n
                break

                case '*': n1 *= n
            }

            escreve()
        }

        function limparTela(){
            escreve = ''
            output.innerHTML = escreve
        }

    </script>
</body>
</body>
</html>
</html>
