<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Exercício da Aula 03</h2>
    <h3>Vídeo 22</h3>

    <script>
       var ano = 1004

       while(ano <= 2026){
        if(!(ano % 100 === 0) || ano % 400 === 0){
            document.write(ano+" <br>")
        }else{
            document.write(ano + " não é bissexto<br>")
        }

        //ano = ano + 4
        ano +=4

        }
    </script>
</body>
