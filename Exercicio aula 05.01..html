<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lógica de programação com Javascript</h1>
    <h2>Aula 04</h2>
    <h3>Video 28</h3>

    <!-- BUTTONS-->
    <button onclick="mostrarAreaAlert()">Mostrar Area Alert</button>
    <button onclick="mostrarAreaOutput()">Mostrar area Output</button>

    <div id="output">Output</div>

    <script>

        //FUNÇÃO MOSTRAR AREA ALERT
        function mostrarAreaAlert(){
            var largura = prompt("Digite a largura")
            largura = parseFloat(largura)

            var altura = prompt("Digite a altura")
            altura = parseFloat(altura)

            var area = calcularArea(largura, altura)

            alert("A área calculada é "+ area);
        }

        //FUNÇÃO MOSTRAR AREA OUTPUT
        function mostrarAreaOutput(){
            var largura = prompt("Digite a largura")
            largura = parseFloat(largura)

            var altura = prompt("Digite a altura")
            altura = parseFloat(altura)

            var area = calcularArea(largura, altura)

            document.querySelector("#output").innerHTML = "A área calculada é " + area;
        }
        
        mostrarAreaAlert();

        //FUNÇÃO CALCULAR AREA
        function calcularArea(l, a){
            return l * a
        }


        

        //
        

    </script>
</body>
</html>
